version: '3.8'

services:
  server:
    build: .
    container_name: zerikai_memory_server
    restart: unless-stopped
    ports:
      - "8200:8200"
    volumes:
      # We mount .brain so your ChromaDB vectors and context files persist
      - ./.brain:/app/.brain
    env_file:
      - .env
    extra_hosts:
      # Allows the container to access the host machine (Ollama)
      - "host.docker.internal:host-gateway"
